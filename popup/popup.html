<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 6C3 4.34315 4.34315 3 6 3H10C11.1046 3 12 3.89543 12 5V7H18C19.6569 7 21 8.34315 21 10V18C21 19.6569 19.6569 21 18 21H6C4.34315 21 3 19.6569 3 18V6Z" fill="url(#logo-grad1)"/>
            <path d="M8 11C8 10.4477 8.44772 10 9 10H15C15.5523 10 16 10.4477 16 11V11C16 11.5523 15.5523 12 15 12H9C8.44772 12 8 11.5523 8 11V11Z" fill="white" fill-opacity="0.7"/>
            <path d="M8 15C8 14.4477 8.44772 14 9 14H13C13.5523 14 14 14.4477 14 15V15C14 15.5523 13.5523 16 13 16H9C8.44772 16 8 15.5523 8 15V15Z" fill="white" fill-opacity="0.5"/>
            <defs>
              <linearGradient id="logo-grad1" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7c3aed"/>
                <stop offset="1" stop-color="#06b6d4"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="logo-text">TabNest</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btn-snapshot" title="Take Snapshot Now">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M20.94 11A8.994 8.994 0 1 1 12.06 3"/></svg>
        </button>
      </div>
    </header>

    <!-- ── Search ── -->
    <div class="search-bar">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search tabs, sessions, history…" autocomplete="off" />
      <kbd class="search-shortcut" id="search-clear" style="display:none;">✕</kbd>
    </div>

    <!-- ── Nav Tabs ── -->
    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab active" id="nav-open" role="tab" data-view="open">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Open Tabs
        <span class="tab-count" id="open-count">0</span>
      </button>
      <button class="nav-tab" id="nav-sessions" role="tab" data-view="sessions">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
        Sessions
        <span class="tab-count" id="sessions-count">0</span>
      </button>
      <button class="nav-tab" id="nav-history" role="tab" data-view="history">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5V16h4"/></svg>
        History
      </button>
    </nav>

    <!-- ── Content Views ── -->
    <main class="content" id="content">

      <!-- Open Tabs View -->
      <section class="view active" id="view-open">
        <div class="view-header">
          <span class="view-title" id="open-tabs-title">All Windows</span>
          <div class="view-actions">
            <button class="pill-btn" id="btn-select-mode">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              Select
            </button>
          </div>
        </div>

        <!-- Floating selection bar (shown in select mode) -->
        <div class="selection-bar" id="selection-bar">
          <span class="selection-count" id="selection-count">0 selected</span>
          <div class="selection-actions">
            <button class="pill-btn" id="btn-select-all">All</button>
            <button class="pill-btn" id="btn-deselect-all">None</button>
            <button class="pill-btn accent" id="btn-save-selected" disabled>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
              Save Selected
            </button>
            <button class="pill-btn" id="btn-cancel-select">✕</button>
          </div>
        </div>

        <div class="windows-list" id="windows-list">
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading tabs…</span>
          </div>
        </div>
      </section>

      <!-- Sessions View -->
      <section class="view" id="view-sessions">
        <div class="view-header">
          <span class="view-title">Saved Sessions</span>
          <div class="view-actions">
            <button class="pill-btn accent" id="btn-new-session">+ Save Current</button>
          </div>
        </div>
        <div class="sessions-hint">Click <b>Open</b> to open tabs here · <b>Close</b> to close them</div>
        <div class="sessions-list" id="sessions-list">
          <div class="empty-state" id="sessions-empty">
            <div class="empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            </div>
            <p>No saved sessions yet</p>
            <span>Click "Save Current" to save your open tabs</span>
          </div>
        </div>
      </section>

      <!-- History View -->
      <section class="view" id="view-history">
        <div class="view-header">
          <span class="view-title">Tab History</span>
          <div class="view-actions">
            <button class="pill-btn danger" id="btn-clear-history">Clear</button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="empty-state" id="history-empty">
            <div class="empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5V16h4"/></svg>
            </div>
            <p>No history yet</p>
            <span>Snapshots appear here automatically</span>
          </div>
        </div>
      </section>

    </main>

    <!-- ── Footer ── -->
    <footer class="footer">
      <span class="footer-info" id="footer-info">Privacy-first · Local only</span>
      <div class="footer-actions">
        <button class="text-btn" id="btn-export" title="Export sessions as JSON">Export</button>
        <span class="footer-sep">·</span>
        <button class="text-btn" id="btn-import" title="Import sessions">Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none" />
      </div>
    </footer>

    <!-- ── Modals ── -->
    <div class="modal-overlay" id="modal-overlay">
      <!-- Save Session Modal -->
      <div class="modal" id="modal-save-session">
        <div class="modal-header">
          <h2 class="modal-title">Save Session</h2>
          <button class="modal-close" id="modal-save-close">✕</button>
        </div>
        <div class="modal-body">
          <label class="form-label">Session Name</label>
          <input class="form-input" id="session-name-input" type="text" placeholder="e.g. Work – Monday sprint" />
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" id="modal-save-cancel">Cancel</button>
          <button class="btn-primary" id="modal-save-confirm">Save Session</button>
        </div>
      </div>

    </div>

    <!-- ── Toast ── -->
    <div class="toast" id="toast"></div>

  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
